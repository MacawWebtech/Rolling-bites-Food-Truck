<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Rolling Bites</title>
<meta name="description" content="This page rolled away — head back home or check out the Rolling Bites menu.">
<link rel="shortcut icon" href="assets/images/icon.png" type="image/x-icon">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/dark-mode.css">
<link rel="stylesheet" href="assets/css/rtl.css">
<link rel="stylesheet" href="assets/css/scroll-experience.css">
<link rel="stylesheet" href="assets/css/sparkle-trail.css">
<script>document.documentElement.classList.add('rb-js');setTimeout(function(){document.documentElement.classList.add('rb-off')},3500);</script>
<style>
  .truck-emoji{font-size:5rem;display:inline-block;animation:driveOff 3.5s ease-in-out infinite;}
  @keyframes driveOff{0%{transform:translateX(-30px) rotate(0);}50%{transform:translateX(30px) rotate(2deg);}100%{transform:translateX(-30px) rotate(0);}}
  @media (prefers-reduced-motion: reduce){.truck-emoji{animation:none;}}
</style>
</head>
<body>
<section class="error-page">
  <div class="hero-layer hero-layer-404" data-speed="0.2" aria-hidden="true"></div>
  <div class="container-xl position-relative">
    <span class="truck-emoji" role="img" aria-label="Food truck driving away">🚚</span>
    <div class="error-num">404</div>
    <h1 class="error-heading">Oops! This Bite Rolled Away.</h1>
    <p class="mx-auto error-lead">The page you're looking for isn't on today's menu. It might have moved, or maybe it never existed.</p>
    <div class="d-flex flex-wrap gap-3 justify-content-center mt-4">
      <a href="index.html" class="btn btn-primary">Back Home</a>
      <a href="menu.html" class="btn btn-outline-light">View Menu</a>
    </div>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
<script defer src="assets/js/scroll-experience.js"></script>
<script defer src="assets/js/sparkle-trail.js"></script>
</body>
</html>
