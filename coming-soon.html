<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon | Rolling Bites</title>
<meta name="description" content="Rolling Bites is launching soon in your city. Sign up to be the first to know when we roll in.">
<link rel="shortcut icon" href="assets/images/icon.png" type="image/x-icon">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/dark-mode.css">
<link rel="stylesheet" href="assets/css/rtl.css">
<link rel="stylesheet" href="assets/css/scroll-experience.css">
<link rel="stylesheet" href="assets/css/sparkle-trail.css">
<script>document.documentElement.classList.add('rb-js');setTimeout(function(){document.documentElement.classList.add('rb-off')},3500);</script>
</head>
<body>
<section class="coming-soon">
  <div class="hero-layer hero-layer-coming-soon" data-speed="0.2" aria-hidden="true"></div>
  <div class="container-xl position-relative py-5">
    <span class="brand-logo-badge mb-3 mx-auto badge-inline-center"><img src="assets/images/logo.png" alt="Rolling Bites Food Truck" class="brand-logo brand-logo-xl"></span>
    <h1 class="coming-soon-heading">Something Delicious<br>Is Rolling In.</h1>
    <p class="mx-auto mb-0 coming-soon-lead">Our truck is being fitted with a brand-new grill and menu. Sign up below to be the first to know when and where we launch.</p>

    <div class="countdown" data-countdown="2026-12-01T00:00:00">
      <div class="box"><div class="num" data-c-days>00</div><div class="lbl">Days</div></div>
      <div class="box"><div class="num" data-c-hours>00</div><div class="lbl">Hours</div></div>
      <div class="box"><div class="num" data-c-min>00</div><div class="lbl">Minutes</div></div>
      <div class="box"><div class="num" data-c-sec>00</div><div class="lbl">Seconds</div></div>
    </div>

    <form class="d-flex flex-wrap gap-2 justify-content-center mx-auto max-w-460" data-newsletter-form>
      <label class="visually-hidden" for="csEmail">Email address</label>
      <input type="email" id="csEmail" class="form-control flex-input-220" placeholder="you@email.com" required>
      <button class="btn btn-primary" type="submit">Notify Me</button>
    </form>
    <p class="small mt-2 d-none text-white" data-newsletter-msg></p>

    <div class="d-flex gap-2 justify-content-center mt-4">
      <a href="#" class="social-circle" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
      <a href="#" class="social-circle" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
      <a href="#" class="social-circle" aria-label="Twitter"><i class="bi bi-twitter-x"></i></a>
    </div>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
<script defer src="assets/js/scroll-experience.js"></script>
<script defer src="assets/js/sparkle-trail.js"></script>
</body>
</html>
